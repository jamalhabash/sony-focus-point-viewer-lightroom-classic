[package]
name = "focuspoint"
version = "0.1.0"
edition = "2021"
description = "Read and render the autofocus point of Sony a7 IV (ILCE-7M4) photos"
license = "0BSD"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# libjpeg-turbo (mozjpeg fork), built statically from source via `cc`:
# region-limited (jpeg_crop_scanline / jpeg_skip_scanlines) and DCT-scaled
# decoding, and fast baseline encoding. NEON on aarch64; no nasm needed.
mozjpeg-sys = { version = "2.2", default-features = false, features = ["with_simd", "unwinding"] }
fast_image_resize = "6"
memmap2 = "0.9"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Image decoding is painfully slow unoptimised; keep tests snappy.
[profile.dev.package."*"]
opt-level = 2
